version: "3.9"

services:
  dnso:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dnso
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "9000:8080/tcp"
    environment:
      DNSO_DB_PATH: /data/dnso.db
      DNSO_BIND_ADDR: :53
      DNSO_UPSTREAM: 8.8.8.8:53
      DNSO_CACHE: "true"
      DNSO_WEB_ADDR: :8080
    volumes:
      - dnso-data:/data

  prometheus:
    image: prom/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - dnso

volumes:
  dnso-data: